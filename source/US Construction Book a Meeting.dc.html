<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Book a Meeting · HydroSense</title>
<link rel="preconnect" href="https://calendly.com" />
<link rel="preconnect" href="https://assets.calendly.com" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --hs-accent: #0E7490; --hs-link-hover: #0B5A70; }
  @media (prefers-color-scheme: dark) { :root { --hs-accent: #22D3EE; --hs-link-hover: #67E8F9; } }
  html { -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #FAFAFA; -webkit-font-smoothing: antialiased; }
  @media (prefers-color-scheme: dark) { body { background: #060607; } }
  a { color: var(--hs-accent); text-decoration: none; }
  a:hover { color: var(--hs-link-hover); }
  @keyframes hsPulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  @supports not (height: 100dvh) { [data-cal-root] { height: 100vh !important; } }
  @media (prefers-reduced-motion: reduce) { [data-cal-loader] span { animation: none !important; opacity: .7 !important; } }
</style>
<script src="https://assets.calendly.com/assets/external/widget.js" async=""></script>
</helmet>
<main data-cal-root="" aria-label="Schedule a meeting" style="position: relative; width: 100%; height: 100dvh; overflow: hidden;">
  <div data-cal-loader="" aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; pointer-events: none; opacity: {{ loaderOp }}; transition: opacity .4s ease;">
    <span style="width: 7px; height: 7px; border-radius: 100px; background: var(--hs-accent); animation: hsPulse 1.2s ease-in-out infinite;"></span>
    <span style="width: 7px; height: 7px; border-radius: 100px; background: var(--hs-accent); animation: hsPulse 1.2s ease-in-out .15s infinite;"></span>
    <span style="width: 7px; height: 7px; border-radius: 100px; background: var(--hs-accent); animation: hsPulse 1.2s ease-in-out .3s infinite;"></span>
  </div>
  <div data-cal="" style="position: absolute; inset: 0; opacity: {{ calOp }}; transition: opacity .5s ease;"></div>
  <sc-if value="{{ failed }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px;">
      <a href="https://calendly.com/sirisha-2/10min" target="_blank" rel="noopener noreferrer" style="font-family: ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 500; padding: 12px 4px; border-bottom: 1px solid currentColor;">Open the booking calendar</a>
    </div>
  </sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false, failed: false };
  base = "https://calendly.com/sirisha-2/10min";

  componentDidMount() {
    this.mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    this.onScheme = () => this.mountCal();
    if (this.mq) {
      if (this.mq.addEventListener) this.mq.addEventListener("change", this.onScheme);
      else if (this.mq.addListener) this.mq.addListener(this.onScheme);
    }
    this.onMsg = (e) => {
      if (typeof e.origin !== "string" || e.origin.indexOf("calendly.com") === -1) return;
      const ev = e.data && e.data.event;
      if (typeof ev === "string" && ev.indexOf("calendly.") === 0) this.markReady();
    };
    window.addEventListener("message", this.onMsg);
    this.whenCalendly(() => this.mountCal());
    this.safeT = setTimeout(() => this.markReady(), 7000);
    this.failT = setTimeout(() => { if (!this.frameLoaded) this.setState({ failed: true }); }, 15000);
  }

  componentWillUnmount() {
    if (this.mq) {
      if (this.mq.removeEventListener) this.mq.removeEventListener("change", this.onScheme);
      else if (this.mq.removeListener) this.mq.removeListener(this.onScheme);
    }
    window.removeEventListener("message", this.onMsg);
    clearInterval(this.pollT);
    clearInterval(this.frameT);
    clearTimeout(this.safeT);
    clearTimeout(this.failT);
  }

  whenCalendly(cb) {
    const ok = () => window.Calendly && window.Calendly.initInlineWidget;
    if (ok()) { cb(); return; }
    if (!document.querySelector('script[src*="assets.calendly.com/assets/external/widget.js"]')) {
      const s = document.createElement("script");
      s.src = "https://assets.calendly.com/assets/external/widget.js";
      s.async = true;
      document.head.appendChild(s);
    }
    let n = 0;
    this.pollT = setInterval(() => {
      if (ok()) { clearInterval(this.pollT); cb(); }
      else if (++n > 150) clearInterval(this.pollT);
    }, 100);
  }

  url() {
    const dark = this.mq ? this.mq.matches : false;
    const c = dark ? ["0f0f12", "fafafa", "22d3ee"] : ["ffffff", "1a1a1a", "0e7490"];
    return this.base + "?background_color=" + c[0] + "&text_color=" + c[1] + "&primary_color=" + c[2];
  }

  mountCal() {
    const el = document.querySelector("[data-cal]");
    if (!el || !window.Calendly || !window.Calendly.initInlineWidget) return;
    const url = this.url();
    if (url === this.curUrl) return;
    this.curUrl = url;
    this.frameLoaded = false;
    if (this.state.ready) this.setState({ ready: false });
    el.innerHTML = "";
    window.Calendly.initInlineWidget({ url: url, parentElement: el });
    clearInterval(this.frameT);
    let tries = 0;
    const grab = () => {
      const f = el.querySelector("iframe");
      if (!f) { if (++tries > 40) clearInterval(this.frameT); return; }
      clearInterval(this.frameT);
      // Match Calendly's own scheme so the browser keeps the frame transparent.
      f.style.colorScheme = "light";
      f.style.background = "transparent";
      f.setAttribute("allowtransparency", "true");
      f.setAttribute("title", "Schedule a meeting");
      f.style.display = "block";
      f.style.width = "100%";
      f.style.height = "100%";
      f.style.border = "0";
      f.addEventListener("load", () => { this.frameLoaded = true; setTimeout(() => this.markReady(), 250); }, { once: true });
    };
    grab();
    if (!el.querySelector("iframe")) this.frameT = setInterval(grab, 50);
  }

  markReady() {
    clearTimeout(this.safeT);
    if (!this.state.ready || this.state.failed) this.setState({ ready: true, failed: false });
  }

  renderVals() {
    const r = this.state.ready;
    const f = this.state.failed;
    return { loaderOp: r || f ? 0 : 1, calOp: r && !f ? 1 : 0, failed: f };
  }
}
</script>
</body>
</html>
